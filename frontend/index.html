
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Oxigen X3</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;z-index:5;background:#111a;padding:12px;border-radius:10px}
#status{color:#8fda91;font-size:13px}
#resources{margin-top:7px;font-size:14px}
#help{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#111a;padding:10px;border-radius:8px;font-size:13px;text-align:center;white-space:nowrap}
#crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;pointer-events:none}
#mobile{display:none;position:fixed;inset:0;z-index:4;pointer-events:none}
.control{position:absolute;pointer-events:auto;border:2px solid #ffffff80;background:#1119;color:white;border-radius:50%;width:65px;height:65px;font-size:13px}
#jump{right:25px;bottom:35px}
#hit{right:100px;bottom:110px}
#stick{left:25px;bottom:35px;width:120px;height:120px;border-radius:50%;border:2px solid #ffffff70;background:#1116;pointer-events:auto}
#knob{position:absolute;left:35px;top:35px;width:46px;height:46px;border-radius:50%;background:#ffffff80}
</style>
</head>
<body>
<div id="hud">
  <b>OXIGEN X3</b>
  <div id="status">Подключение...</div>
  <div id="players">Игроков: 0</div>
  <div id="resources">🪵 Дерево: 0<br>🪨 Камень: 0</div>
</div>
<div id="crosshair">+</div>
<div id="help">WASD — движение · Мышь — обзор · ЛКМ — добыча · Пробел — прыжок</div>
<div id="mobile">
  <div id="stick"><div id="knob"></div></div>
  <button class="control" id="jump">ПРЫЖОК</button>
  <button class="control" id="hit">УДАР</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b8d5);
scene.fog = new THREE.Fog(0x87b8d5, 35, 110);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0,1.7,5);

const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x52613a,2));
const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(20,40,10);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({color:0x557d3d})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.05;
scene.add(ground);

const objects=[];
const materialTree=new THREE.MeshStandardMaterial({color:0x68442b});
const materialLeaves=new THREE.MeshStandardMaterial({color:0x286b35});
const materialStone=new THREE.MeshStandardMaterial({color:0x858585});

function createTree(x,z){
  const group=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,2,6),materialTree);
  trunk.position.y=1;
  group.add(trunk);
  const leaves=new THREE.Mesh(new THREE.ConeGeometry(1.2,3,6),materialLeaves);
  leaves.position.y=3;
  group.add(leaves);
  group.position.set(x,0,z);
  scene.add(group);
  objects.push({mesh:group,type:'wood',amount:30,hits:0});
}

function createStone(x,z){
  const mesh=new THREE.Mesh(new THREE.DodecahedronGeometry(.8,0),materialStone);
  mesh.position.set(x,.65,z);
  mesh.scale.set(1.2,.8,1);
  scene.add(mesh);
  objects.push({mesh,type:'stone',amount:20,hits:0});
}

for(let i=0;i<45;i++){
  const x=(Math.random()-.5)*75;
  const z=(Math.random()-.5)*75;
  if(Math.abs(x)<5 && Math.abs(z)<5) continue;
  if(Math.random()>.35) createTree(x,z);
  else createStone(x,z);
}

const keys={};
let yaw=0,pitch=0,velocityY=0,onGround=true;
let wood=0,stone=0;
const speed=5;
const status=document.getElementById('status');
const players=document.getElementById('players');

const ws=new WebSocket('wss://oxigen.onrender.com/ws');
ws.onopen=()=>{
  status.textContent='Сервер подключён';
  ws.send(JSON.stringify({type:'join',nickname:'Survivor'}));
};
ws.onmessage=e=>{
  try{
    const data=JSON.parse(e.data);
    if(data.type==='players') players.textContent='Игроков: '+data.players.length;
    if(data.type==='welcome') status.textContent='На сервере';
  }catch{}
};
ws.onerror=()=>status.textContent='Ошибка подключения';
ws.onclose=()=>status.textContent='Сервер отключён';

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space' && onGround){
    velocityY=7;
    onGround=false;
  }
});
document.addEventListener('keyup',e=>keys[e.code]=false);

renderer.domElement.addEventListener('click',()=>{
  if(!isMobile) renderer.domElement.requestPointerLock();
});
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement===renderer.domElement){
    yaw-=e.movementX*.002;
    pitch-=e.movementY*.002;
    pitch=Math.max(-1.4,Math.min(1.4,pitch));
  }
});

const isMobile='ontouchstart' in window;
if(isMobile){
  document.getElementById('mobile').style.display='block';
  document.getElementById('help').textContent='Джойстик — движение · Правая часть экрана — обзор';
}

let moveX=0,moveZ=0;
const stick=document.getElementById('stick');
const knob=document.getElementById('knob');
let stickActive=false;

stick.addEventListener('pointerdown',e=>{
  stickActive=true;
  stick.setPointerCapture(e.pointerId);
  updateStick(e);
});
stick.addEventListener('pointermove',e=>{
  if(stickActive) updateStick(e);
});
stick.addEventListener('pointerup',()=>{
  stickActive=false;moveX=0;moveZ=0;
  knob.style.left='35px';knob.style.top='35px';
});
function updateStick(e){
  const r=stick.getBoundingClientRect();
  let x=e.clientX-(r.left+r.width/2);
  let y=e.clientY-(r.top+r.height/2);
  const len=Math.hypot(x,y);
  if(len>35){x=x/len*35;y=y/len*35;}
  moveX=x/35;moveZ=y/35;
  knob.style.left=(35+x)+'px';
  knob.style.top=(35+y)+'px';
}

let lookPointer=null,lastX=0,lastY=0;
document.addEventListener('pointerdown',e=>{
  if(!isMobile || e.target.closest('#stick') || e.target.closest('.control'))return;
  lookPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;
});
document.addEventListener('pointermove',e=>{
  if(lookPointer!==e.pointerId)return;
  yaw-=(e.clientX-lastX)*.006;
  pitch-=(e.clientY-lastY)*.006;
  pitch=Math.max(-1.4,Math.min(1.4,pitch));
  lastX=e.clientX;lastY=e.clientY;
});
document.addEventListener('pointerup',()=>lookPointer=null);

document.getElementById('jump').addEventListener('click',()=>{
  if(onGround){velocityY=7;onGround=false;}
});
document.getElementById('hit').addEventListener('click',harvest);
document.addEventListener('mousedown',e=>{
  if(e.button===0 && !isMobile) harvest();
});

function harvest(){
  const origin=camera.position.clone();
  const direction=new THREE.Vector3();
  camera.getWorldDirection(direction);
  const ray=new THREE.Raycaster(origin,direction,0,3.5);
  const hits=ray.intersectObjects(objects.flatMap(o=>o.mesh.children?.length?[...o.mesh.children]:[o.mesh]),true);
  if(!hits.length)return;
  const found=objects.find(o=>o.mesh===hits[0].object || o.mesh===hits[0].object.parent);
  if(!found)return;
  found.hits++;
  if(found.hits>=4){
    if(found.type==='wood')wood+=found.amount*3;
    else stone+=found.amount*3;
    scene.remove(found.mesh);
    objects.splice(objects.indexOf(found),1);
    document.getElementById('resources').innerHTML=
      `🪵 Дерево: ${wood}<br>🪨 Камень: ${stone}`;
  }
}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);

  let forward=0,side=0;
  if(keys.KeyW)forward++;
  if(keys.KeyS)forward--;
  if(keys.KeyA)side--;
  if(keys.KeyD)side++;
  forward-=moveZ;
  side+=moveX;

  const length=Math.hypot(forward,side);
  if(length>0){forward/=length;side/=length;}

  camera.position.x+=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed*dt;
  camera.position.z+=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed*dt;

  velocityY-=18*dt;
  camera.position.y+=velocityY*dt;
  if(camera.position.y<1.7){
    camera.position.y=1.7;velocityY=0;onGround=true;
  }

  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
